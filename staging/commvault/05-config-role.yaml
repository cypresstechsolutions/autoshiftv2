apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cv-view
  namespace: commvault
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "deployments", "replicasets"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cvpatcher
  namespace: commvault
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
rules:
- apiGroups: [""]
  resources: ["secrets", "pods", "configmaps", "services", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
